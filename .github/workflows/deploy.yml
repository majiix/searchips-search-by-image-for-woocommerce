name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: wporg-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tag to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify readme Stable tag matches Git tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: $GITHUB_REF_NAME"
            exit 1
          fi
          stable_tag=$(grep -m1 -E '^Stable tag:' readme.txt | tr -d '\r' | sed -E 's/^Stable tag:[[:space:]]*//; s/[[:space:]]+$//')
          if [[ "$stable_tag" != "$tag_version" ]]; then
            echo "Mismatch: readme.txt Stable tag ($stable_tag) != Git tag ($tag_version)"
            exit 1
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: searchips-search-by-image-for-woocommerce
